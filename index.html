<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Демо сайта Османовой</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#f3f4f1;--ink:#121513;--soft:#4a514c;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 system-ui,-apple-system,sans-serif;padding:48px 16px}
main{max-width:560px;margin:auto}
h1{font-size:28px;margin:0 0 8px}
p{color:var(--soft);margin:0 0 28px}
a{display:block;background:var(--card);border-radius:14px;padding:20px 22px;margin-bottom:12px;color:inherit;text-decoration:none;box-shadow:0 1px 0 #0000000d}
a b{display:block;font-size:20px}
a span{color:var(--soft);font-size:15px}
.b{background:#10302a;color:#eef0e8}.b span{color:#b9c4bb}
</style>
</head>
<body>
<main>
  <h1>Два варианта дизайна</h1>
  <p>Демо-версии сайта. Выберите, чтобы посмотреть.</p>
  <a class="b" href="b/"><b>Вариант B «Личный»</b><span>Тёмно-зелёный, рассказ от первого лица</span></a>
  <a href="a/"><b>Вариант A «Вопросы»</b><span>Светлый, сразу список частых вопросов</span></a>
</main>
</body>
</html>
